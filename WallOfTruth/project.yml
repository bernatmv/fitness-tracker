name: WallOfTruth
options:
  bundleIdPrefix: com.bernat
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 426R48XBW3
    MARKETING_VERSION: "2.0.0"
    # Builds below 100 were the paid-upfront app; see PurchaseManager.firstFreemiumBuild.
    CURRENT_PROJECT_VERSION: "100"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: NO
targets:
  WallOfTruth:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - Services
      - Shared
      - path: Widget
        excludes: ["WidgetBundle.swift", "Info.plist", "*.entitlements", "Assets.xcassets"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernat.wall-of-truth
        PRODUCT_NAME: WallOfTruth
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WallOfTruth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: WallOfTruthWidget
    scheme:
      testTargets:
        - WallOfTruthTests
      storeKitConfiguration: App/WallOfTruth.storekit
  WallOfTruthWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        # Same identifier as the React Native widget so placed widgets keep working.
        PRODUCT_BUNDLE_IDENTIFIER: com.bernat.wall-of-truth.FitnessTrackerWidget
        PRODUCT_NAME: WallOfTruthWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/WallOfTruthWidget.entitlements
        SKIP_INSTALL: YES
  WallOfTruthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: WallOfTruth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bernat.wall-of-truth.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/WallOfTruth.app/WallOfTruth
        BUNDLE_LOADER: $(TEST_HOST)
